# cargo-deny configuration: supply-chain policy for every PR.

[graph]
# Scan every optional feature's dependencies, not just the default ones. Set
# here rather than as a `--all-features` flag: cargo-deny 0.19 only accepts
# that flag before the subcommand, so passing it from CI is version-sensitive.
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # rsa: Marvin timing side-channel. JWT signing goes through aws-lc-rs
  # (jsonwebtoken `aws_lc_rs` feature); the `rsa` crate only generates keys and
  # encodes JWK/PEM, which are not attacker-timed operations. No fixed release exists.
  { id = "RUSTSEC-2023-0071", reason = "rsa used for keygen/encoding only; signing is aws-lc-rs" },
  # paste: unmaintained proc-macro pulled in by utoipa-axum; compile-time only.
  { id = "RUSTSEC-2024-0436", reason = "compile-time proc-macro via utoipa-axum; revisit when utoipa-axum drops it" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # TLS is rustls everywhere. OpenSSL is present only because webauthn-rs 0.5
  # needs it for attestation, and it is statically vendored (see Cargo.toml).
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
