# cargo-deny configuration: supply-chain policy for every PR.

[graph]
# Scan every optional feature's dependencies, not just the default ones. Set
# here rather than as a `--all-features` flag: cargo-deny 0.19 only accepts
# that flag before the subcommand, so passing it from CI is version-sensitive.
all-features = true
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
  # zip: a build-dependency of utoipa-swagger-ui, which unpacks its own vendored
  # Swagger UI archive at compile time. The advisories concern extracting
  # attacker-controlled archives; nothing here extracts one, and zip is not in
  # the shipped binary. utoipa-swagger-ui 10 requires zip ^8.6, the fix is 9.
  { id = "RUSTSEC-2026-0367", reason = "build-time extraction of utoipa-swagger-ui's own vendored archive; lift when utoipa-swagger-ui moves to zip 9" },
  { id = "RUSTSEC-2026-0368", reason = "build-time extraction of utoipa-swagger-ui's own vendored archive; lift when utoipa-swagger-ui moves to zip 9" },
  { id = "RUSTSEC-2026-0369", reason = "build-time extraction of utoipa-swagger-ui's own vendored archive; lift when utoipa-swagger-ui moves to zip 9" },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "BSL-1.0",
  "0BSD",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
  # TLS is rustls everywhere. The server links no OpenSSL; only the tests'
  # webauthn-rs (an oracle for rIDM's own passkey code) does.
  { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
