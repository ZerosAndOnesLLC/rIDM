# cargo-deny for the FIPS build (docs/src/deploy/fips.md): the crates that must
# not be in it. `deny.toml` stays the supply-chain policy for every build; this
# file only checks bans, on the FIPS feature set:
#
#   cargo deny --config deny-fips.toml check bans
#
# The tests keep webauthn-rs (which links OpenSSL) as an oracle; dev
# dependencies aren't part of this graph, and scripts/fips/check-binary.sh
# checks the built binary too.
#
# Each Phase 14 sub-phase that moves a crypto function onto aws-lc-rs adds the
# crate it replaced here (working-plan.md, issues #2-#6).

[graph]
no-default-features = true
features = [
  "ridm-api/fips",
  "ridm-api/embedded-ui",
  "ridm-api/kerberos",
  "ridm-api/hsm-pkcs11",
  "ridm-api/kms-aws",
  "ridm-api/kms-vault",
  "ridm-api/kms-gcp",
  "ridm-api/kms-azure",
  "ridm-cli/fips",
]
exclude-dev = true
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = [
  { crate = "ring", reason = "TLS and crypto go through aws-lc-rs on the AWS-LC FIPS module" },
  { crate = "native-tls", reason = "use rustls with the FIPS provider" },
  # 14.4 (#5): key generation and TOTP on aws-lc-rs.
  { crate = "rsa", reason = "RSA keys come from aws-lc-rs" },
  { crate = "p256", reason = "P-256 keys come from aws-lc-rs" },
  { crate = "ed25519-dalek", reason = "Ed25519 keys come from aws-lc-rs" },
  { crate = "totp-rs", reason = "TOTP is computed with aws-lc-rs HMAC (totp-rs stays a test-only oracle)" },
  # 14.6 (#4) and 14.7 (#6): PBKDF2 and the Kerberos AES types on aws-lc-rs.
  { crate = "pbkdf2", reason = "PBKDF2 is aws-lc-rs (RustCrypto pbkdf2 stays a test-only oracle)" },
  { crate = "picky-krb", reason = "Kerberos crypto is aws-lc-rs (picky-krb stays a test-only oracle)" },
  { crate = "aes", reason = "AES is aws-lc-rs" },
  { crate = "cbc", reason = "AES-CBC is aws-lc-rs" },
  { crate = "des", reason = "no DES" },
  # 14.8 (#2): passkeys on aws-lc-rs, and with them the last OpenSSL.
  { crate = "webauthn-rs", reason = "passkeys are rIDM's own relying party on aws-lc-rs" },
  { crate = "webauthn-rs-core", reason = "passkeys are rIDM's own relying party on aws-lc-rs" },
  { crate = "openssl", reason = "no OpenSSL: all crypto is aws-lc-rs" },
  { crate = "openssl-sys", reason = "no OpenSSL: all crypto is aws-lc-rs" },
  { crate = "openssl-src", reason = "no OpenSSL: all crypto is aws-lc-rs" },
]
