[workspace]
resolver = "3"
members = [
    "api",
    "crates/ridm-auth",
    "crates/ridm-core",
    "crates/ridm-cli",
    "examples/axum-api",
    "examples/confidential-client",
]
# cargo-fuzz crates are built by `cargo fuzz`, not as workspace members.
exclude = ["api/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ZerosAndOnesLLC/rIDM"
rust-version = "1.98"

# Every dependency is pinned to an exact version (see working-plan.md §2).
# Bump deliberately; keep the table in the plan in sync.
[workspace.dependencies]
ridm-core = { path = "crates/ridm-core", version = "0.1.0" }

# HTTP
axum = { version = "=0.8.9", features = ["macros"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["cors", "trace", "compression-gzip", "set-header", "fs"] }
tower_governor = "=0.8.0"
http = "=1.5.0"
tokio = { version = "=1.53.1", features = ["full"] }

# Storage
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
deadpool-redis = { version = "=0.23.1", features = ["rt_tokio_1", "cluster", "sentinel"] }
redis = { version = "=1.7.0", features = ["tokio-rustls-comp", "script", "cluster-async", "sentinel"] }

# Crypto / tokens
# Signing/verification via aws-lc-rs (constant-time RSA); the `rsa` crate is
# used only for key generation and JWK/PEM encoding.
jsonwebtoken = { version = "=11.0.0", features = ["aws_lc_rs"] }
rsa = { version = "=0.9.10", features = ["pem"] }
p256 = { version = "=0.14.0", features = ["ecdsa", "pem"] }
ed25519-dalek = { version = "=3.0.0", features = ["rand_core", "pkcs8", "alloc"] }
argon2 = "=0.6.0"
# Legacy hash verification for migrated users (never used for new hashes).
bcrypt = "=0.19.3"
pbkdf2 = "=0.13.0"
md-5 = "=0.11.0"
totp-rs = { version = "=6.0.0", features = ["qr", "gen_secret"] }
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "=0.5.5"
# webauthn-rs 0.5 needs OpenSSL for attestation; vendored so the distroless image
# has no dynamic libssl dependency.
openssl-sys = { version = "=0.9.117", features = ["vendored"] }
chacha20poly1305 = "=0.11.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
rand = "=0.10.2"
# rsa 0.9 still takes a rand_core 0.6 RNG for key generation.
rand_core_06 = { package = "rand_core", version = "=0.6.4", features = ["getrandom"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "=0.7.0"
# JWE (RSA-OAEP + AES-GCM) for encrypted ID tokens; same backend jsonwebtoken/rustls use.
aws-lc-rs = "=1.18.1"
subtle = "=2.6.1"
zeroize = "=1.9.0"
base64 = "=0.23.1"
hex = "=0.4.3"
sha1 = "=0.11.0"
# SAML 2.0: a read-only XML tree that refuses DTDs (so no entity expansion
# or external entities), self-signed certificates for the IdP metadata, the
# X.509 reader webauthn-rs already builds (SP certificates), and raw DEFLATE
# for the HTTP-Redirect binding. XML-DSig and XML-Enc are rIDM's own code.
roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "=0.16.0"
flate2 = "=1.1.10"

# Outbound
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] }
lettre = { version = "=0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier", "smtp-transport", "builder"] }
handlebars = "=6.4.4"
# DNS, for organization domain verification (TXT lookups only).
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }

# Serde / types
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
csv = "=1.4.0"
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.20"
validator = { version = "=0.21.0", features = ["derive"] }
regex = "=1.13.1"
url = { version = "=2.5.8", features = ["serde"] }
ipnet = { version = "=2.12.2", features = ["serde"] }
# Geo-IP lookups for risk-based adaptive authentication; reads a MaxMind DB
# file the deployment supplies (no data is bundled). Default features only:
# the file is read into memory rather than memory-mapped.
maxminddb = { version = "=0.32.0", default-features = false }
async-trait = "=0.1.92"
futures = "=0.3.34"

# Config / observability
clap = { version = "=4.6.7", features = ["derive", "env"] }
dotenvy = "=0.15.7"
rpassword = "=7.5.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "=0.33.0"

# API docs
utoipa = { version = "=5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }

# Embedded UI
rust-embed = { version = "=8.12.0", features = ["mime-guess"] }

# Allocator for the static (musl) release binaries
mimalloc = { version = "=0.1.52", default-features = false }

# Dev
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis"] }
testcontainers = { version = "=0.27.3", features = ["reusable-containers"] }
proptest = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds still optimise the two deliberately expensive computations:
# the big-integer arithmetic behind RSA key generation (unoptimised, one key
# takes seconds, and creating a tenant or rotating its keys waits for one) and
# argon2 password hashing (every sign-in and password change). Only these
# crates are affected; everything else keeps fast, debuggable dev builds.
[profile.dev.package.rsa]
opt-level = 3
[profile.dev.package.num-bigint-dig]
opt-level = 3
[profile.dev.package.num-integer]
opt-level = 3
[profile.dev.package.num-traits]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
