[workspace]
resolver = "3"
members = [
    "api",
    "crates/ridm-auth",
    "crates/ridm-core",
    "crates/ridm-cli",
    "examples/axum-api",
    "examples/confidential-client",
]
# cargo-fuzz crates are built by `cargo fuzz`, not as workspace members.
exclude = ["api/fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/ZerosAndOnesLLC/rIDM"
rust-version = "1.98"

# Every dependency is pinned to an exact version (see working-plan.md §2).
# Bump deliberately; keep the table in the plan in sync.
[workspace.dependencies]
ridm-core = { path = "crates/ridm-core", version = "0.3.0" }

# HTTP
axum = { version = "=0.8.9", features = ["macros"] }
axum-server = { version = "=0.8.0", features = ["tls-rustls"] }
tower = "=0.5.3"
tower-http = { version = "=0.7.1", features = ["cors", "trace", "compression-gzip", "compression-br", "set-header", "fs"] }
tower_governor = "=0.8.0"
http = "=1.5.0"
tokio = { version = "=1.53.1", features = ["full"] }

# Storage
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
deadpool = { version = "=0.13.1", default-features = false, features = ["managed", "rt_tokio_1"] }
deadpool-redis = { version = "=0.23.1", features = ["rt_tokio_1", "cluster", "sentinel"] }
redis = { version = "=1.7.0", features = ["tokio-rustls-comp", "script", "cluster-async", "sentinel"] }
# In-process (L1) cache: size-bounded, per-entry TTL.
moka = { version = "=0.12.16", features = ["sync"] }

# Crypto / tokens
# Signing, verification and key generation all go through aws-lc-rs.
jsonwebtoken = { version = "=11.0.0", features = ["aws_lc_rs"] }
argon2 = "=0.6.0"
# Legacy hash verification for migrated users (never used for new hashes).
bcrypt = "=0.19.3"
pbkdf2 = "=0.13.0"
md-5 = "=0.11.0"
# Tests only: an independent TOTP implementation the server's codes are checked against.
totp-rs = { version = "=6.0.0", features = ["otpauth"] }
# Tests only: the WebAuthn library rIDM's own relying party replaced, kept as
# an oracle (it links OpenSSL; the server doesn't).
webauthn-rs = { version = "=0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
# The WebAuthn wire types, serde only.
webauthn-rs-proto = "=0.5.5"
base64urlsafedata = "=0.5.5"
chacha20poly1305 = "=0.11.0"
sha2 = "=0.11.0"
hmac = "=0.13.0"
rand = "=0.10.2"
rustls = { version = "=0.23.45", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls-platform-verifier = "=0.7.0"
# JWE (RSA-OAEP + AES-GCM) for encrypted ID tokens; same backend jsonwebtoken/rustls use.
aws-lc-rs = "=1.18.1"
subtle = "=2.6.1"
zeroize = "=1.9.0"
base64 = "=0.23.1"
hex = "=0.4.3"
# SAML 2.0: a read-only XML tree that refuses DTDs (so no entity expansion
# or external entities), self-signed certificates for the IdP metadata, the
# X.509 reader (SP certificates), and raw DEFLATE
# for the HTTP-Redirect binding. XML-DSig and XML-Enc are rIDM's own code.
roxmltree = { version = "=0.21.1", default-features = false, features = ["std", "positions"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
x509-parser = "=0.16.0"
flate2 = "=1.1.10"

# Outbound
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls", "form"] }
lettre = { version = "=0.11.23", default-features = false, features = ["tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier", "smtp-transport", "builder", "pool"] }
handlebars = "=6.4.4"
# DNS, for organization domain verification (TXT lookups only).
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
# LDAP / Active Directory upstream: async client over tokio, TLS through
# rustls on the same aws-lc-rs provider as everything else.
ldap3 = { version = "=0.12.1", default-features = false, features = ["tls-rustls-aws-lc-rs"] }
# Tests only: an independent implementation of the RFC 3962 Kerberos AES
# types, which ridm-api's own (on aws-lc-rs) are checked against.
picky-krb = "=0.12.4"
# Key custody (the `hsm-pkcs11` and `kms-aws` features of ridm-api): the master
# key's data keys wrapped by an HSM or AWS KMS. Off in the default build. The
# AWS crates' default `rustls` feature is the legacy hyper 0.14 / ring stack;
# `default-https-client` is the current one on aws-lc-rs.
cryptoki = "=0.12.1"
aws-config = { version = "=1.12.0", default-features = false, features = ["default-https-client", "rt-tokio", "sso", "credentials-process"] }
aws-sdk-kms = { version = "=1.121.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
# The SDK's HTTP client, named only so the FIPS build can pick its FIPS TLS mode
# (the default client hard-codes the non-FIPS aws-lc-rs provider).
aws-smithy-http-client = { version = "=1.4.2", default-features = false }

# Serde / types
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
csv = "=1.4.0"
uuid = { version = "=1.26.1", features = ["v4", "v7", "serde"] }
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.20"
validator = { version = "=0.21.0", features = ["derive"] }
regex = "=1.13.1"
url = { version = "=2.5.8", features = ["serde"] }
ipnet = { version = "=2.12.2", features = ["serde"] }
# Geo-IP lookups for risk-based adaptive authentication; reads a MaxMind DB
# file the deployment supplies (no data is bundled). Default features only:
# the file is read into memory rather than memory-mapped.
maxminddb = { version = "=0.32.0", default-features = false }
async-trait = "=0.1.92"
futures = "=0.3.34"

# Config / observability
clap = { version = "=4.6.7", features = ["derive", "env"] }
dotenvy = "=0.15.7"
rpassword = "=7.5.4"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
metrics = "=0.24.6"
metrics-exporter-prometheus = { version = "=0.18.3", default-features = false }
opentelemetry = "=0.32.0"
opentelemetry_sdk = { version = "=0.32.1", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-client", "reqwest-rustls"] }
tracing-opentelemetry = "=0.33.0"

# API docs
utoipa = { version = "=5.5.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }

# Embedded UI
rust-embed = { version = "=8.12.0", features = ["mime-guess"] }

# Allocator for the static (musl) release binaries
mimalloc = { version = "=0.1.52", default-features = false }

# Dev
testcontainers-modules = { version = "=0.15.0", features = ["postgres", "redis"] }
testcontainers = { version = "=0.27.3", features = ["reusable-containers"] }
proptest = "=1.11.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Debug builds still optimise argon2 password hashing, which is deliberately
# expensive (every sign-in and password change). Only these crates are
# affected; everything else keeps fast, debuggable dev builds. (RSA key
# generation is aws-lc-rs, which is C and optimised in every build.)
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
