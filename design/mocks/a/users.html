<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · acme · rIDM (A)</title>
<link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="../shared/mock.css">
<script src="../shared/data.js"></script><script src="../shared/theme.js"></script><script src="../shared/mock.js"></script>
</head>
<body data-page="Users">
<div class="frame">
  <aside class="rail">
    <div class="brand"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6z"/><path d="M9 12l2 2 4-4"/></svg></i>rIDM</div>
    <button class="tenant" aria-label="Tenant: Acme Corporation">
      <span class="glyph">A</span>
      <span><b>Acme Corporation</b><small>acme · 120 users</small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
    </button>
    <nav class="nav" data-nav aria-label="Console"></nav>
    <div class="me"><span class="av">A</span><span><b>admin</b><small>Global administrator</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H4V3h5M16 17l5-5-5-5M21 12H9"/></svg></div>
  </aside>
  <div>
    <div class="top">
      <div class="crumbs"><button class="btn icon quiet burger" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button><span class="here">Users</span></div>
      <div class="tools">
        <button class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg><span>Search or jump to…</span><kbd>⌘K</kbd></button>
        <div class="seg" role="group" aria-label="Theme"><button aria-pressed="true" aria-label="System"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4h18v12H3zM8 20h8M12 16v4"/></svg></button><button aria-label="Light"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button aria-label="Dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 13A9 9 0 1 1 11 3a7 7 0 0 0 10 10z"/></svg></button></div>
      </div>
    </div>
    <main>
      <header class="ph">
        <div><h1>Users</h1><p>Everyone who can sign in to Acme Corporation.</p></div>
        <div class="actions">
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M6 11l6 6 6-6M4 21h16"/></svg>Export</button>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V9M6 13l6-6 6 6M4 3h16"/></svg>Import</button>
          <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18v14H3zM3 7l9 6 9-6"/></svg>Invite</button>
          <button class="btn primary"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New user</button>
        </div>
      </header>
      <div class="filters">
        <input class="input search-in" placeholder="Search by username or email" aria-label="Search users">
        <select class="input" aria-label="Status"><option>Any status</option><option>Active</option><option>Disabled</option><option>Locked</option><option>Pending</option></select>
        <select class="input" aria-label="Group"><option>Any group</option><option>staff / engineering</option></select>
        <label class="chk"><input type="checkbox"> Include deleted</label>
        <span class="count">120 users</span>
      </div>
      <div class="table-wrap">
      <table class="table" aria-label="Users">
        <thead><tr>
          <th class="sel"><input type="checkbox" aria-label="Select all"></th>
          <th aria-sort="ascending"><button>Username <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 15l4 4 4-4"/></svg></button></th>
          <th><button>Email</button></th>
          <th><button>Department</button></th>
          <th><button>Status</button></th>
          <th><button>Last sign-in</button></th>
        </tr></thead>
        <tbody data-rows="a"></tbody>
      </table>
      </div>
      <div class="tfoot"><span>Showing 24 of 120</span><button class="btn sm">Load more</button></div>
    </main>
  </div>
</div>
<script>
window.ROW = (u, e, s, v, last, dept) => `<tr>
  <td class="sel"><input type="checkbox" aria-label="Select ${u}"></td>
  <td><a class="u" href="user.html">${u}</a></td>
  <td class="muted">${e}${v ? "" : '<span class="unv">unverified</span>'}</td>
  <td class="muted">${dept}</td>
  <td><span class="status ${s}">${MOCK.statusLabel[s]}</span></td>
  <td class="muted">${last}</td></tr>`;
</script>
<script src="../shared/console.js"></script>
</body>
</html>
