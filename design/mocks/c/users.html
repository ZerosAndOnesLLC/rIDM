<script>
const SEL = new Set(["ada.knuth", "claude.allen"]);
window.ROW = (u, e, s, v, last, dept) => `<tr ${SEL.has(u) ? 'aria-selected="true"' : ""}>
  <td class="sel"><input type="checkbox" aria-label="Select ${u}" ${SEL.has(u) ? "checked" : ""}></td>
  <td><a class="u" href="user.html">${u}</a></td>
  <td class="muted">${e}${v ? "" : '<span class="unv">unverified</span>'}</td>
  <td class="muted">${dept}</td>
  <td><span class="status ${s}">${MOCK.statusLabel[s]}</span></td>
  <td class="mono">${last}</td>
  <td class="muted">${["ada.lovelace","alan.hopper","barbara.hamilton","claude.turing","ada.dijkstra","claude.shannon"].includes(u) ? "Passkey" : "—"}</td>
  <td class="act"><button class="btn sm icon quiet" aria-label="Actions for ${u}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button></td></tr>`;
</script>
<script src="../shared/console.js"></script>
<script>
(function(){const seg=document.querySelector('.tools .seg, .me2 .seg, .foot .seg'); if(!seg) return; const bs=[...seg.querySelectorAll('button')]; const vals=["","light","dark"];
function d(){seg.hidden=MOCKCTL.get("mode.allow","1")!=="1"; bs.forEach((b,i)=>b.setAttribute("aria-pressed", vals[i]===MOCKCTL.get("mode.user","")));}
bs.forEach((b,i)=>b.onclick=()=>{MOCKCTL.set("mode.user",vals[i]);d();}); d(); document.addEventListener("mock:theme",d);})();
</script>
