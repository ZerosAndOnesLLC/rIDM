# Postgres and Valkey for the chart's smoke test only: single pods, no
# volumes. Production runs both outside the chart. run.sh creates the
# `postgres-init` ConfigMap from deploy/postgres/init-app-role.sh first.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18.6-alpine
          env:
            - {name: POSTGRES_DB, value: ridm}
            - {name: POSTGRES_USER, value: ridm}
            - {name: POSTGRES_PASSWORD, value: ridm}
            - {name: RIDM_MIGRATOR_PASSWORD, value: migrator-smoke}
            - {name: RIDM_APP_PASSWORD, value: app-smoke}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ridm", "-d", "ridm"]}
            periodSeconds: 2
          volumeMounts:
            - {name: init, mountPath: /docker-entrypoint-initdb.d}
      volumes:
        - name: init
          configMap: {name: postgres-init, defaultMode: 0755}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels: {app: valkey}
  template:
    metadata:
      labels: {app: valkey}
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:9.1.2-alpine3.24
          ports: [{containerPort: 6379}]
          readinessProbe:
            exec: {command: ["valkey-cli", "ping"]}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: {app: valkey}
  ports: [{port: 6379}]
