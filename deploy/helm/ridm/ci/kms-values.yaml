# Key custody without a master key in the chart: AWS KMS through IRSA, and
# Vault's Kubernetes auth as the previous backend while rows move off it.
publicUrl: https://id.example.com
database:
  existingSecret: {name: ridm-db, key: uri}
redis:
  existingSecret: {name: ridm-valkey, key: url}
migrations:
  database:
    existingSecret: {name: ridm-db-owner, key: uri}
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/ridm
keyCustody:
  wrapper: aws-kms
  previous: vault
  env:
    AWS_KMS_KEY_ID: alias/ridm
    AWS_REGION: us-east-1
    VAULT_ADDR: https://vault.example.com:8200
    VAULT_TRANSIT_KEY: ridm
    VAULT_KUBERNETES_ROLE: ridm
  existingSecret: ridm-key-custody
  mountServiceAccountToken: true
