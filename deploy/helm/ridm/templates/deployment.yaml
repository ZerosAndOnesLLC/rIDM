{{- $fullname := include "ridm.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "ridm.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 25%
  selector:
    matchLabels:
      {{- include "ridm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll the pods when their configuration changes.
        checksum/config: {{ include "ridm.plainEnv" . | sha256sum }}
        checksum/secret: {{ include "ridm.inlineSecrets" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "ridm.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ridm.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.keyCustody.mountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: ridm
          image: {{ include "ridm.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            {{- if .Values.mtls.listener.enabled }}
            - name: mtls
              containerPort: 8443
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $fullname }}
            {{- with .Values.keyCustody.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if .Values.dataRegions.names }}
            - secretRef:
                name: {{ required "dataRegions.existingSecret is required with dataRegions.names" .Values.dataRegions.existingSecret }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- range (include "ridm.secretItems" . | fromYamlArray) }}
            {{- if not (and (include "ridm.masterKeyFile" $) (eq .env "MASTER_KEY")) }}
            {{- include "ridm.secretEnv" (dict "item" . "secret" $fullname) | nindent 12 }}
            {{- end }}
            {{- end }}
            {{- if include "ridm.masterKeyFile" . }}
            - name: MASTER_KEY_FILE
              value: /run/secrets/ridm/master-key
            {{- end }}
            {{- with .Values.mtls.publicUrl }}
            - name: MTLS_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mtls.clientCertHeader }}
            - name: CLIENT_CERT_HEADER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.mtls.listener.enabled }}
            - name: MTLS_BIND
              value: "0.0.0.0:8443"
            - name: MTLS_CERT
              value: /run/secrets/ridm-mtls/tls.crt
            - name: MTLS_KEY
              value: /run/secrets/ridm-mtls/tls.key
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if include "ridm.masterKeyFile" . }}
            - name: master-key
              mountPath: /run/secrets/ridm
              readOnly: true
            {{- end }}
            {{- if .Values.mtls.listener.enabled }}
            - name: mtls-tls
              mountPath: /run/secrets/ridm-mtls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- if include "ridm.masterKeyFile" . }}
        {{- include "ridm.masterKeyVolume" (dict "root" . "secret" $fullname) | nindent 8 }}
        {{- end }}
        {{- if .Values.mtls.listener.enabled }}
        - name: mtls-tls
          secret:
            secretName: {{ .Values.mtls.listener.tlsSecret }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- if .Values.topologySpreadConstraints }}
        {{- toYaml .Values.topologySpreadConstraints | nindent 8 }}
        {{- else }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ridm.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "ridm.selectorLabels" . | nindent 14 }}
        {{- end }}
