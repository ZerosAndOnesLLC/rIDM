[package]
name = "ridm-api"
description = "rIDM — multi-tenant OpenID Connect identity server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "ridm-api"

[[bin]]
name = "ridm-api"
path = "src/main.rs"

[lib]
name = "ridm_api"
path = "src/lib.rs"

[features]
# Compile the UI's static export (`ui/out`, from `npm run build` in `ui/`)
# into the binary and serve it on the API's origin: the single-binary deploy
# the container image ships. Off by default so a Rust-only checkout builds
# without Node; a debug build reads the files from `ui/out` at run time.
embedded-ui = []
# mimalloc as the global allocator. The static (musl) release binaries turn it
# on: musl's own allocator serialises threads and falls far behind glibc's
# under a multi-threaded server's load. glibc builds, the image among them,
# have no need of it.
mimalloc = ["dep:mimalloc"]

[dependencies]
ridm-core = { workspace = true }
mimalloc = { workspace = true, optional = true }

axum = { workspace = true }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }

sqlx = { workspace = true }
deadpool-redis = { workspace = true }
redis = { workspace = true }

jsonwebtoken = { workspace = true }
rsa = { workspace = true }
p256 = { workspace = true }
ed25519-dalek = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }
pbkdf2 = { workspace = true }
md-5 = { workspace = true }
totp-rs = { workspace = true }
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
openssl-sys = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
rand_core_06 = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
aws-lc-rs = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }

reqwest = { workspace = true }
hickory-resolver = { workspace = true }
lettre = { workspace = true }
handlebars = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
validator = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
ipnet = { workspace = true }
maxminddb = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

dotenvy = { workspace = true }
rpassword = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }

rust-embed = { workspace = true }

[dev-dependencies]
ridm-core = { workspace = true, features = ["test-support"] }
# The published relying-party crate, tested against the tokens this server
# really issues (`tests/ridm_auth.rs`).
ridm-auth = { path = "../crates/ridm-auth", version = "0.1.0", default-features = false }
reqwest = { workspace = true, features = ["cookies", "query"] }
testcontainers-modules = { workspace = true }
testcontainers = { workspace = true }
proptest = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
