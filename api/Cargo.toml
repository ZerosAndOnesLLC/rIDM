[package]
name = "ridm-api"
description = "rIDM — multi-tenant OpenID Connect identity server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "ridm-api"

[[bin]]
name = "ridm-api"
path = "src/main.rs"

[lib]
name = "ridm_api"
path = "src/lib.rs"

[features]
# The FIPS 140-3 build (docs/src/deploy/fips.md): aws-lc-rs on the AWS-LC FIPS
# module and rustls' FIPS provider. Off by default; every feature works in
# both builds.
fips = [
  "aws-lc-rs/fips",
  "rustls/fips",
  "tokio-rustls/fips",
  "aws-smithy-http-client?/rustls-aws-lc-fips",
]
# Compile the UI's static export (`ui/out`, from `npm run build` in `ui/`)
# into the binary and serve it on the API's origin: the single-binary deploy
# the container image ships. Off by default so a Rust-only checkout builds
# without Node; a debug build reads the files from `ui/out` at run time.
embedded-ui = []
# mimalloc as the global allocator. The static (musl) release binaries turn it
# on: musl's own allocator serialises threads and falls far behind glibc's
# under a multi-threaded server's load. glibc builds, the image among them,
# have no need of it.
mimalloc = ["dep:mimalloc"]
# Test doubles the integration tests and the fuzz targets drive (the
# miniature KDC in `kerberos::testing`). Never in a shipped build; the
# dev-dependency on this package below turns it on for `cargo test`.
test-support = []
# Kerberos / SPNEGO desktop sign-in: the ticket acceptor behind
# `/t/{slug}/kerberos/negotiate`. Without it a `kerberos` identity provider can
# still be configured (tenant documents stay portable between builds) but
# nobody can sign in with it. The released image and binaries turn it on.
kerberos = []
# Key custody backends: an HSM or a cloud KMS wraps the data keys that encrypt
# secrets at rest (see `key_custody`). Each is its own feature so the default
# build stays provider-neutral; `KEY_WRAPPER` picks one at run time, and a
# build without it refuses that setting at start-up. The released image turns
# them all on; the static (musl) binaries every one but PKCS#11, which loads a
# vendor library a static binary cannot.
hsm-pkcs11 = ["dep:cryptoki"]
kms-aws = ["dep:aws-config", "dep:aws-sdk-kms", "dep:aws-smithy-http-client"]
kms-vault = []
kms-gcp = []
kms-azure = []

[dependencies]
ridm-core = { workspace = true }
mimalloc = { workspace = true, optional = true }

axum = { workspace = true }
axum-server = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
http = { workspace = true }
tokio = { workspace = true }

sqlx = { workspace = true }
deadpool-redis = { workspace = true }
moka = { workspace = true }
redis = { workspace = true }

jsonwebtoken = { workspace = true }
argon2 = { workspace = true }
bcrypt = { workspace = true }
md-5 = { workspace = true }
# The WebAuthn wire types (serde only); the ceremonies are `webauthn`.
webauthn-rs-proto = { workspace = true }
base64urlsafedata = { workspace = true }
chacha20poly1305 = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
aws-lc-rs = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
roxmltree = { workspace = true }
rcgen = { workspace = true }
x509-parser = { workspace = true }
flate2 = { workspace = true }

reqwest = { workspace = true }
hickory-resolver = { workspace = true }
ldap3 = { workspace = true }
cryptoki = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
aws-smithy-http-client = { workspace = true, optional = true }
lettre = { workspace = true }
handlebars = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
csv = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
validator = { workspace = true }
regex = { workspace = true }
url = { workspace = true }
ipnet = { workspace = true }
maxminddb = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

dotenvy = { workspace = true }
rpassword = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
tracing-opentelemetry = { workspace = true }

utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-swagger-ui = { workspace = true }

rust-embed = { workspace = true }

[dev-dependencies]
# The webhook test checks signatures with an independent HMAC implementation.
hmac = { workspace = true }
# The TOTP tests generate codes with an independent implementation (totp-rs).
totp-rs = { workspace = true }
# The legacy PBKDF2 tests derive their expected hashes independently (RustCrypto).
pbkdf2 = { workspace = true }
# The Kerberos tests check the aws-lc-rs AES types against picky-krb (17/18).
picky-krb = { workspace = true }
ridm-core = { workspace = true, features = ["test-support"] }
ridm-api = { path = ".", features = ["test-support"] }
# The published relying-party crate, tested against the tokens this server
# really issues (`tests/ridm_auth.rs`).
ridm-auth = { path = "../crates/ridm-auth", version = "0.3.0", default-features = false }
reqwest = { workspace = true, features = ["cookies", "query"] }
testcontainers-modules = { workspace = true }
testcontainers = { workspace = true }
proptest = { workspace = true }
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
# The passkey tests check rIDM's relying party against webauthn-rs, which it
# replaced: each reads what the other stores.
webauthn-rs = { workspace = true }
