# CodeQL, as an advanced configuration rather than GitHub's default setup:
# only this form can exclude paths, and the test suites are full of the values
# a scanner is right to object to everywhere else (see
# `.github/codeql/codeql-config.yml`). Running it here also means the scan
# happens on every pull request, not weekly.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Sunday 04:17 UTC, so a query-pack update is noticed without a push.
    - cron: "17 4 * * 0"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
    env:
      # Since the action started building "overlay" databases on the default
      # branch, the JavaScript/TypeScript analysis of `main` uploads fine but
      # GitHub records it as "Unknown Error" with no rules, and the Security
      # tab reports the scan as failed (2026-09-21, twice on the same commit).
      # Full databases for that language until that is fixed upstream; an
      # empty value leaves the other languages on the action's own choice.
      CODEQL_OVERLAY_DATABASE_MODE: ${{ matrix.language == 'javascript-typescript' && 'none' || '' }}
    steps:
      - uses: actions/checkout@v7

      # The threat model is the default one, `remote`: input that crosses a
      # process boundary counts as untrusted.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
