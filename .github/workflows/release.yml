name: release

# A `v*` tag becomes a release (see CONTRIBUTING.md, "Cutting a release"):
#
#   image      linux/amd64 and linux/arm64, built natively on each architecture,
#              pushed to ghcr.io/zerosandonesllc/ridm as one multi-arch index
#              with BuildKit's SBOM and provenance attestations, signed with
#              cosign (keyless, this workflow's GitHub identity) and carrying
#              a cosign-attested SPDX SBOM
#   binaries   static (musl) ridm-api and ridm for linux amd64 and arm64
#   chart      the Helm chart, packaged and pushed to
#              oci://ghcr.io/zerosandonesllc/charts, signed the same way
#   release    a GitHub release with the tarballs, the chart, the SBOM,
#              SHA256SUMS and its Sigstore bundle, notes from CHANGELOG.md
#   crate      ridm-auth to crates.io, when CARGO_REGISTRY_TOKEN is set
#   baseline   the full k6 load baseline against a release build
#
# The tag must match every version in the tree (scripts/release/check-version.sh).
# A pull request that changes this file or scripts/release runs everything up to
# publishing, so the build is proven before a tag depends on it; nothing is
# pushed, signed or released from a pull request.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users on /token (load baseline)
        default: "200"
      duration:
        description: How long to hold them (load baseline)
        default: "2m"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NODE_VERSION: "24"
  IMAGE: ghcr.io/zerosandonesllc/ridm
  CHART_REPO: oci://ghcr.io/zerosandonesllc/charts

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            scripts/release/check-version.sh "${GITHUB_REF_NAME}"
            version="${GITHUB_REF_NAME#v}"
            publish=true
            scripts/release/notes.sh "$version" > /dev/null
          else
            # A rehearsal: the tree's own version, nothing published.
            version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version *= *"\(.*\)"/\1/p}' Cargo.toml)"
            publish=false
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "publish=$publish"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "version $version, publish $publish, prerelease $prerelease"

  # The UI's static export, built once: the same files go into every binary.
  ui:
    name: ui
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: build (same-origin)
        working-directory: ui
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: ui-out
          path: ui/out
          retention-days: 3

  binaries:
    name: binaries (${{ matrix.arch }})
    needs: [prepare, ui]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ui-out
          path: ui/out
      - name: toolchain
        # rust-toolchain.toml pins the compiler; install it with the musl target.
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q musl-tools
          channel="$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target "$TARGET"
          rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        # Native on each architecture, so musl-gcc is the target's compiler.
        # The server with the UI compiled in, Kerberos desktop sign-in and
        # mimalloc (musl's allocator serialises threads); the CLI on its own,
        # so it does not embed the UI.
        run: |
          triple="$(tr 'a-z-' 'A-Z_' <<<"$TARGET")"
          export "CC_${TARGET//-/_}=musl-gcc" "CARGO_TARGET_${triple}_LINKER=musl-gcc"
          cargo build --release --locked --target "$TARGET" -p ridm-api --features embedded-ui,mimalloc,kerberos
          cargo build --release --locked --target "$TARGET" -p ridm-cli
      - name: check
        run: |
          dir="target/$TARGET/release"
          for bin in ridm-api ridm; do
            file "$dir/$bin"
            file "$dir/$bin" | grep -q 'static' || { echo "$bin is not statically linked" >&2; exit 1; }
          done
          "$dir/ridm" --version
          # The server refuses to start without configuration, and says so.
          set +e
          out="$("$dir/ridm-api" 2>&1)"; code=$?
          set -e
          echo "$out"
          [ "$code" -eq 2 ] && grep -q 'configuration error' <<<"$out"
      - name: package
        run: |
          name="ridm-${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "dist/$name"
          cp "target/$TARGET/release/ridm-api" "target/$TARGET/release/ridm" "dist/$name/"
          cp LICENSE README.md CHANGELOG.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          ls -la dist
      - uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz
          retention-days: 7

  image:
    name: image (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
      # Built on its own architecture (no emulation), pushed by digest only;
      # the `manifest` job joins the two digests under the release's tags.
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || 'type=cacheonly' }}
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' && 'mode=max' || 'false' }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: record digest
        if: env.PUBLISH == 'true'
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 3

  manifest:
    name: manifest
    needs: [prepare, image]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 1.2.3 gets 1.2.3, 1.2 and latest; a pre-release gets only its own tag.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ needs.prepare.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.prerelease == 'false' }}
      - id: push
        name: create the multi-arch index
        working-directory: digests
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
      - uses: sigstore/cosign-installer@v4.1.2
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ridm-${{ needs.prepare.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: sign and attest
        # Keyless: the certificate names this workflow at this tag, which is
        # what `cosign verify` checks (docs/src/deploy/releases.md).
        env:
          REF: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          SBOM: ridm-${{ needs.prepare.outputs.version }}.spdx.json
        run: |
          cosign sign --yes "$REF"
          cosign attest --yes --type spdxjson --predicate "$SBOM" "$REF"
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: ridm-${{ needs.prepare.outputs.version }}.spdx.json
          retention-days: 7

  chart:
    name: chart
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      PUBLISH: ${{ needs.prepare.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0
      - name: package
        # Chart.yaml already carries the release version (check-version.sh);
        # the chart's image tag defaults to its appVersion.
        run: |
          helm lint --strict deploy/helm/ridm -f deploy/helm/ridm/ci/inline-values.yaml
          helm package deploy/helm/ridm --destination dist
          ls -la dist
          test -f "dist/ridm-$VERSION.tgz"
      - name: push
        if: env.PUBLISH == 'true'
        id: push
        run: |
          helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          helm push "dist/ridm-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee push.log
          digest="$(sed -n 's/^Digest: //p' push.log)"
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@v4.1.2
        if: env.PUBLISH == 'true'
      - name: sign
        if: env.PUBLISH == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | cosign login ghcr.io -u "${{ github.actor }}" --password-stdin
          cosign sign --yes "${CHART_REPO#oci://}/ridm@${{ steps.push.outputs.digest }}"
      - uses: actions/upload-artifact@v7
        with:
          name: chart
          path: dist/*.tgz
          retention-days: 7

  release:
    name: release
    needs: [prepare, binaries, manifest, chart]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: chart
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: dist
      - uses: sigstore/cosign-installer@v4.1.2
      - name: checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          DIGEST: ${{ needs.manifest.outputs.digest }}
        run: |
          {
            scripts/release/notes.sh "$VERSION"
            echo
            echo "## Artifacts"
            echo
            echo "- Image: \`$IMAGE:$VERSION\` (\`$DIGEST\`), linux/amd64 and linux/arm64"
            echo "- Helm chart: \`helm install ridm $CHART_REPO/ridm --version $VERSION\`"
            echo "- Static binaries for linux amd64 and arm64 below; verify them with \`SHA256SUMS\` and its Sigstore bundle."
            echo
            echo "Verifying signatures: https://zerosandonesllc.github.io/rIDM/deploy/releases.html#verifying-a-release"
          } > notes.md
          flags=()
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "v$VERSION" dist/* \
            --verify-tag --title "rIDM $VERSION" --notes-file notes.md "${flags[@]}"

  crate:
    name: crate
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: publish ridm-auth
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::notice::CARGO_REGISTRY_TOKEN is not set; ridm-auth was not published to crates.io"
            exit 0
          fi
          cargo publish -p ridm-auth --locked

  load-baseline:
    name: load-baseline
    needs: prepare
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: ridm
          POSTGRES_USER: ridm
          POSTGRES_PASSWORD: ridm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridm -d ridm"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine3.24
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ridm:ridm@localhost:5432/ridm
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build api (release)
        run: cargo build -p ridm-api --release --locked
      - name: start api
        env:
          PUBLIC_URL: http://localhost:8090
          BIND_ADDR: 127.0.0.1:8090
          MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COOKIE_SECURE: "false"
          MIGRATE_ON_START: "true"
          # Any load test runs without the request guard: it would otherwise
          # refuse the generator's single address (perf/README.md).
          RATE_LIMITS: "false"
          BOOTSTRAP_ADMIN_EMAIL: admin@ridm.local
          BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-Now-1234-baseline
        run: |
          nohup target/release/ridm-api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8090/readyz && break; sleep 2; done
          curl -sf localhost:8090/readyz
      - name: open dynamic registration on master (the test registers its own client)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client redis-tools
          # Merge, never `jsonb_set`: a tenant's settings hold only what was
          # written, and `jsonb_set` on an absent `dcr` key does nothing at all.
          psql "$DATABASE_URL" -c "UPDATE tenants SET settings = settings || '{\"dcr\": {\"mode\": \"open\", \"allowed_grants\": [\"client_credentials\"]}}'::jsonb WHERE slug = 'master'"
          psql "$DATABASE_URL" -tAc "SELECT settings->'dcr' FROM tenants WHERE slug = 'master'" | grep -q open
          redis-cli -u "$REDIS_URL" --scan --pattern 'ridm:tenant:*' | xargs -r redis-cli -u "$REDIS_URL" del
          # Clearing Valkey does not reach the API's in-process cache, which
          # keeps a tenant document for fifteen seconds (`cache/layer.rs`).
          sleep 20
      - uses: grafana/setup-k6-action@v1
      - name: k6 baseline
        run: |
          k6 run --summary-export baseline.json \
            -e BASE_URL=http://localhost:8090 -e TENANT=master \
            -e VUS="${{ inputs.vus || '200' }}" -e DURATION="${{ inputs.duration || '2m' }}" \
            perf/token.js | tee baseline.txt
      - name: summary
        if: always()
        run: |
          {
            echo '## Load baseline'
            echo '```'
            tail -n 40 baseline.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-baseline
          path: |
            baseline.json
            baseline.txt
          retention-days: 90
      - name: api log
        if: failure()
        run: tail -n 200 api.log
