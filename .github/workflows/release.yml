name: release

# What a release gets that a pull request does not: the full k6 baseline
# (200 VUs for two minutes against a release build, p99 thresholds) instead of
# the PR smoke. The result is uploaded and summarised for the release notes.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      vus:
        description: Virtual users on /token
        default: "200"
      duration:
        description: How long to hold them
        default: "2m"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  load-baseline:
    name: load-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: ridm
          POSTGRES_USER: ridm
          POSTGRES_PASSWORD: ridm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridm -d ridm"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine3.24
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ridm:ridm@localhost:5432/ridm
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build api (release)
        run: cargo build -p ridm-api --release --locked
      - name: start api
        env:
          PUBLIC_URL: http://localhost:8090
          BIND_ADDR: 127.0.0.1:8090
          MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          COOKIE_SECURE: "false"
          MIGRATE_ON_START: "true"
          # Any load test runs without the request guard: it would otherwise
          # refuse the generator's single address (perf/README.md).
          RATE_LIMITS: "false"
          BOOTSTRAP_ADMIN_EMAIL: admin@ridm.local
          BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-Now-1234-baseline
        run: |
          nohup target/release/ridm-api > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8090/readyz && break; sleep 2; done
          curl -sf localhost:8090/readyz
      - name: open dynamic registration on master (the test registers its own client)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client redis-tools
          # Merge, never `jsonb_set`: a tenant's settings hold only what was
          # written, and `jsonb_set` on an absent `dcr` key does nothing at all.
          psql "$DATABASE_URL" -c "UPDATE tenants SET settings = settings || '{\"dcr\": {\"mode\": \"open\", \"allowed_grants\": [\"client_credentials\"]}}'::jsonb WHERE slug = 'master'"
          psql "$DATABASE_URL" -tAc "SELECT settings->'dcr' FROM tenants WHERE slug = 'master'" | grep -q open
          redis-cli -u "$REDIS_URL" --scan --pattern 'ridm:tenant:*' | xargs -r redis-cli -u "$REDIS_URL" del
          # Clearing Valkey does not reach the API's in-process cache, which
          # keeps a tenant document for fifteen seconds (`cache/layer.rs`).
          sleep 20
      - uses: grafana/setup-k6-action@v1
      - name: k6 baseline
        run: |
          k6 run --summary-export baseline.json \
            -e BASE_URL=http://localhost:8090 -e TENANT=master \
            -e VUS="${{ inputs.vus || '200' }}" -e DURATION="${{ inputs.duration || '2m' }}" \
            perf/token.js | tee baseline.txt
      - name: summary
        if: always()
        run: |
          {
            echo '## Load baseline'
            echo '```'
            tail -n 40 baseline.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: load-baseline
          path: |
            baseline.json
            baseline.txt
          retention-days: 90
      - name: api log
        if: failure()
        run: tail -n 200 api.log
