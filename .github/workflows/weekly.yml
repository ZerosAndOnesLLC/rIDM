name: weekly

# The long runs that are too slow for any per-change check: four hours per
# fuzz target (the release gate gives each one a minute). The weekly
# conformance run lives with the rest of the suite in `conformance.yml`.
#
# Self-hosted (zo-local): this workflow runs only on its schedule or by hand,
# never for a pull request, so no fork's code reaches these runners. The
# runners are persistent: the toolchain, cargo-fuzz and the sanitizer build
# (CARGO_TARGET_DIR below) stay on them, so within a run only the first target
# on each runner pays for the build. One target at a time, leaving the other
# runner free for everything else that uses it.

on:
  schedule:
    - cron: "41 2 * * 6"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "14400"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fuzz-long:
    name: fuzz-long (${{ matrix.target }})
    runs-on: [self-hosted, Linux, X64, zo-local]
    # Four hours of fuzzing plus, for the first target, the sanitizer build.
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target:
          - authorize_params
          - jwt_decode
          - redirect_uri
          - pkce
          - scim_filter
          - saml_message
          - kerberos_token
          - client_cert
          - passkey_answer
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      # `cargo fuzz` composes its own RUSTFLAGS (sanitizer, coverage).
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v7
      # The runners are provisioned with a C/C++ toolchain; anything missing is
      # installed only when sudo works without a password.
      - name: native build deps
        run: |
          missing=""
          for p in build-essential pkg-config; do
            dpkg -s "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            if sudo -n true 2>/dev/null; then
              sudo -n apt-get update -qq
              sudo -n apt-get install -y -qq $missing
            else
              echo "::error::runner is missing packages:$missing (install them on the runner host)"
              exit 1
            fi
          fi
          # A target dir outside the checkout (which actions/checkout cleans),
          # kept on the runner between runs.
          echo "CARGO_TARGET_DIR=$HOME/.cache/ridm-ci/target-fuzz" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: fuzz
        run: api/fuzz/run.sh "${{ inputs.seconds || '14400' }}" "${{ matrix.target }}"
      - name: corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: api/fuzz/corpus/${{ matrix.target }}
          retention-days: 30
      - name: crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: api/fuzz/artifacts
          retention-days: 90
