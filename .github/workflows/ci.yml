# The pull-request checks: lint, unit and integration tests. Nothing here
# builds a release artifact, a container image or the UI's static export; the
# heavier suites (UI build and e2e, coverage, load and fuzz smokes, packaging,
# FIPS image, Helm, examples, OpenID conformance) gate the `release` workflow,
# which runs when a GitHub release is published. Job ids are check names; keep
# them stable.
#
# GitHub-hosted runners only: this is a public repository and a fork's pull
# request must never run on a self-hosted runner.
name: ci

on:
  pull_request:
    paths-ignore:
      - docs/**
      - site/**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"
  # The optional server features every release build turns on: Kerberos and
  # the key custody backends (13.6). Lint and test with them all.
  RIDM_FEATURES: ridm-api/kerberos,ridm-api/hsm-pkcs11,ridm-api/kms-aws,ridm-api/kms-vault,ridm-api/kms-gcp,ridm-api/kms-azure
  NODE_VERSION: "26"
  FIPS_FEATURES: ridm-cli/fips,ridm-api/kerberos,ridm-api/hsm-pkcs11,ridm-api/kms-aws,ridm-api/kms-vault,ridm-api/kms-gcp,ridm-api/kms-azure,ridm-api/test-support

jobs:
  static:
    name: static
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Three feature sets of the whole workspace (default, optional, FIPS)
      # outgrow the runner's disk: drop the preinstalled SDKs never used here.
      - name: free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      # rust-toolchain.toml pins the compiler and its rustfmt/clippy.
      - name: toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      # Clippy type-checks everything `cargo check` would, so it runs alone.
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The Kerberos acceptor and the key custody backends are optional
      # features (on in the release builds): lint the code both ways.
      - name: clippy (optional features)
        run: cargo clippy --workspace --all-targets --locked --features "$RIDM_FEATURES" -- -D warnings
      # The FIPS build (docs/src/deploy/fips.md) lints on its own feature set;
      # its image is built and booted in the release gate.
      - name: clippy (fips)
        run: cargo clippy -p ridm-api -p ridm-cli --all-targets --locked --no-default-features --features "$FIPS_FEATURES" -- -D warnings
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: cargo package
        # `ridm-auth` is published to crates.io, so it has to stand up outside
        # the workspace: its own version requirements, its README, and a build
        # from the packaged archive alone.
        run: cargo package -p ridm-auth --locked
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          # No `--all-features`: `deny.toml` sets it, and cargo-deny 0.19 only
          # accepts that flag before the subcommand.
          arguments: ""
      # Pinned: 0.20 moved `--config` off the `check` subcommand.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0
      - name: cargo deny (fips bans)
        run: cargo deny check bans --config deny-fips.toml
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: npm ci
        working-directory: ui
        run: npm ci
      - name: eslint
        working-directory: ui
        run: npm run lint
      - name: tsc
        working-directory: ui
        run: npm run typecheck
      - name: build scripts
        working-directory: ui
        run: npm run test:scripts && npm run test:unit
      - name: npm audit
        working-directory: ui
        # The shipped bundle is what an end user runs; build-only tooling is
        # covered by the lockfile review, not by failing the build.
        run: npm audit --omit=dev
      - name: helm and kubeconform
        run: |
          curl -fsSL https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | sudo tar xz -C /usr/local/bin kubeconform
      - name: helm chart (lint, schema)
        run: deploy/helm/lint.sh

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # The SAML interop tests check rIDM's XML signatures and encryption
      # against xmlsec1; without it they would skip, so CI requires it.
      - name: xmlsec1
        run: sudo apt-get update -q && sudo apt-get install -y -q xmlsec1
      - name: cargo test (lib + bins)
        env:
          RIDM_REQUIRE_XMLSEC1: "1"
        run: cargo test --workspace --lib --bins --locked --features "$RIDM_FEATURES"
      - name: cargo test (fips, lib)
        run: cargo test -p ridm-api --lib --locked --no-default-features --features "ridm-api/fips,$RIDM_FEATURES,ridm-api/test-support"

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: ridm
          POSTGRES_USER: ridm
          POSTGRES_PASSWORD: ridm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ridm -d ridm"
          --health-interval 5s --health-timeout 3s --health-retries 20
      valkey:
        image: valkey/valkey:9.1.2-alpine3.24
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      RIDM_TEST_DATABASE_URL: postgres://ridm:ridm@localhost:5432/ridm
      RIDM_TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7
      # The all-features build (the AWS SDK among it) and the test
      # containers (Vault, OpenBao, local-kms, the KDC) outgrow the runner's
      # disk: drop the preinstalled SDKs this job never uses.
      - name: free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /
      - name: toolchain
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      # xmlsec1 for the SAML interop tests; SoftHSM for the PKCS#11 key
      # custody test, with a token directory of the job's own.
      - name: xmlsec1 and SoftHSM
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q xmlsec1 softhsm2
          mkdir -p "$RUNNER_TEMP/softhsm/tokens"
          printf 'directories.tokendir = %s\nobjectstore.backend = file\nlog.level = ERROR\n' \
            "$RUNNER_TEMP/softhsm/tokens" > "$RUNNER_TEMP/softhsm/softhsm2.conf"
          echo "SOFTHSM2_CONF=$RUNNER_TEMP/softhsm/softhsm2.conf" >> "$GITHUB_ENV"
      - name: cargo test (integration)
        env:
          RIDM_REQUIRE_XMLSEC1: "1"
          # The MIT Kerberos interop test runs a KDC container; with Docker
          # there it must not skip.
          RIDM_REQUIRE_KDC: "1"
          RIDM_REQUIRE_SOFTHSM: "1"
          RIDM_TEST_PKCS11_MODULE: /usr/lib/softhsm/libsofthsm2.so
        run: cargo test --workspace --tests --locked --features "$RIDM_FEATURES"
      # Valkey by client certificate, the FIPS deployment's form, in that build too.
      - name: valkey TLS (fips)
        run: cargo test -p ridm-api --test valkey_tls --locked --no-default-features --features "ridm-api/fips,$RIDM_FEATURES,ridm-api/test-support"
